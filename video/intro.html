<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Intro</title>
<style>
@font-face { font-family: Anton; src: url(assets/anton-latin-400-normal.woff2); }
@font-face { font-family: Inter; font-weight: 500; src: url(assets/inter-latin-500-normal.woff2); }
@font-face { font-family: Inter; font-weight: 700; src: url(assets/inter-latin-700-normal.woff2); }
@font-face { font-family: Playfair; font-style: italic; src: url(assets/playfair-display-latin-400-italic.woff2); }
:root { --bg: #0e0d0c; --ink: #ece6da; --gold: #c8963e; --muted: #8a8378; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
.abs { position: absolute; }
.anton { font-family: Anton, sans-serif; text-transform: uppercase; line-height: 1; }
.inter { font-family: Inter, sans-serif; font-weight: 700; text-transform: uppercase; }
.serif { font-family: Playfair, serif; font-style: italic; }
.center { left: 0; width: 1080px; text-align: center; }
.clip { overflow: hidden; }
#photoWrap { inset: 0; opacity: 0; }
#photo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; object-position: 50% 30%; transform-origin: 50% 35%; }
#photoShade { inset: 0; background: linear-gradient(to bottom, rgba(14,13,12,.75) 0%, rgba(14,13,12,0) 18%, rgba(14,13,12,0) 48%, rgba(14,13,12,.85) 70%, rgba(14,13,12,.97) 100%); }
#vignette { inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
#grain { inset: 0; background-size: 270px 480px; opacity: .08; mix-blend-mode: screen; pointer-events: none; }
#fade { inset: 0; background: #000; opacity: 0; }
#sweep { left: 0; top: 959px; height: 4px; width: 1080px; background: var(--gold); transform-origin: 0 50%; transform: scaleX(0); box-shadow: 0 0 24px rgba(200,150,62,.8); }
.gold { color: var(--gold); }
.ink { color: var(--ink); }
</style>
</head>
<body>
<div id="stage">
  <!-- scene 3: photo -->
  <div id="photoWrap" class="abs">
    <img id="photo" src="assets/mohan-intro.jpg">
    <div id="photoShade" class="abs"></div>
  </div>

  <!-- scene 1-2: heartbeat becomes the barbell -->
  <svg id="mark" class="abs" width="800" height="440" viewBox="0 -220 800 440" style="left:140px; top:680px; overflow:visible">
    <defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g id="markInner" filter="url(#glow)">
      <path id="ecg" d="M0 0H306L326 -32L346 0H364L382 46L408 -206L436 114L454 0H472L490 -36L508 0H800" fill="none" stroke="#c8963e" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="#c8963e">
        <rect class="plate big" x="64" y="-170" width="68" height="340" rx="12"/>
        <rect class="plate small" x="146" y="-118" width="46" height="236" rx="12"/>
        <rect class="plate small" x="608" y="-118" width="46" height="236" rx="12"/>
        <rect class="plate big" x="668" y="-170" width="68" height="340" rx="12"/>
      </g>
    </g>
  </svg>
  <div id="t1" class="abs anton ink center clip" style="top:900px; font-size:168px; height:180px"><div>Doc Beyond</div></div>
  <div id="t2" class="abs anton gold center clip" style="top:1080px; font-size:168px; height:180px"><div>The Barbell</div></div>
  <div id="tag" class="abs inter center" style="top:1300px; font-size:28px; letter-spacing:10px; color:var(--muted)">Medicine · Muscle · Mind</div>

  <!-- scene 3 text -->
  <div id="top3" class="abs inter" style="left:70px; top:170px; width:940px; font-size:24px; letter-spacing:8px; display:flex; justify-content:space-between">
    <span class="gold">Doc Beyond The Barbell</span><span class="ink" style="opacity:.75">Ep. 01</span>
  </div>
  <div id="eyebrow" class="abs inter gold" style="left:70px; top:1180px; font-size:26px; letter-spacing:10px">Meet your doc</div>
  <div id="name" class="abs serif ink clip" style="left:62px; top:1225px; font-size:118px; height:150px; width:1000px"><div>Dr. Mohan Chetty</div></div>
  <div id="mbbs" class="abs anton gold" style="left:70px; top:1385px; font-size:64px; letter-spacing:4px">MBBS</div>
  <div id="awards" class="abs inter ink" style="left:70px; top:1478px; font-size:24px; letter-spacing:5px; line-height:1.7; opacity:.9">
    <div><span class="gold">3rd</span> &nbsp;Mr. Tamil Nadu</div><div><span class="gold">1st</span> &nbsp;District-level champion</div>
  </div>
  <div id="k1" class="abs anton ink" style="left:66px; top:1230px; font-size:150px">Smart<br><span class="gold">training.</span></div>
  <div id="k2" class="abs anton ink" style="left:66px; top:1230px; font-size:150px">Health &amp;<br><span class="gold">physiology.</span></div>
  <div id="k3" class="abs anton ink" style="left:66px; top:1230px; font-size:150px">Evidence-<br><span class="gold">based.</span></div>

  <div id="sweep" class="abs"></div>

  <!-- scene 4: manifesto -->
  <div id="m1" class="abs anton ink center clip" style="top:690px; font-size:112px; height:124px"><div>Built by discipline.</div></div>
  <div id="m2" class="abs anton ink center clip" style="top:820px; font-size:112px; height:124px"><div>Guided by science.</div></div>
  <div id="m3" class="abs anton gold center clip" style="top:950px; font-size:112px; height:124px"><div>Beyond the barbell</div></div>
  <div id="rule" class="abs" style="left:490px; top:1135px; width:100px; height:4px; background:var(--gold); transform:scaleX(0)"></div>
  <svg id="mark2" class="abs" width="300" height="165" viewBox="0 -220 800 440" style="left:390px; top:1190px; opacity:0">
    <path d="M0 0H306L326 -32L346 0H364L382 46L408 -206L436 114L454 0H472L490 -36L508 0H800" fill="none" stroke="#c8963e" stroke-width="34" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#c8963e"><rect x="64" y="-170" width="68" height="340" rx="12"/><rect x="146" y="-118" width="46" height="236" rx="12"/><rect x="608" y="-118" width="46" height="236" rx="12"/><rect x="668" y="-170" width="68" height="340" rx="12"/></g>
  </svg>
  <div id="handle" class="abs center" style="top:1390px; font-family:Inter,sans-serif; font-weight:700; font-size:40px; letter-spacing:3px; color:var(--ink); opacity:0">@docbeyondthebarbell</div>

  <div id="vignette" class="abs"></div>
  <div id="grain" class="abs"></div>
  <div id="fade" class="abs"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

const ecg = $('ecg');
const ECG_LEN = ecg.getTotalLength();
ecg.style.strokeDasharray = ECG_LEN;
const plates = [...document.querySelectorAll('.plate')];

// slide-up reveal: element's inner div rises out of a clipped box
function reveal(el, p, out = 0) {
  const inner = el.firstElementChild;
  inner.style.transform = `translateY(${(1 - easeOut(p)) * 110}%)`;
  el.style.opacity = p > 0 ? 1 - out : 0;
}
// a word that slams in and cuts out
function slam(el, t, a, b) {
  const pin = seg(t, a, a + .14), pout = seg(t, b - .08, b);
  const on = t >= a && t < b;
  el.style.opacity = on ? easeOut(pin) * (1 - pout) : 0;
  el.style.transform = `scale(${lerp(1.18, 1, easeOut(pin))})`;
  el.style.transformOrigin = '0% 50%';
}

window.setTime = function (t) {
  // ----- scene 1: heartbeat draws, barbell forms -----
  const draw = seg(t, .25, 1.45);
  ecg.style.strokeDashoffset = ECG_LEN * (1 - draw);
  plates.forEach((pl, i) => {
    const big = pl.classList.contains('big');
    const p = seg(t, big ? 1.5 : 1.62, big ? 1.86 : 1.98);
    pl.style.transformBox = 'fill-box'; pl.style.transformOrigin = '50% 50%';
    pl.style.transform = `scaleY(${p > 0 ? easeBack(p) : 0})`;
    pl.style.opacity = p > 0 ? 1 : 0;
  });
  // ----- scene 2: mark rises, name reveals -----
  const mv = easeInOut(seg(t, 2.1, 2.7));
  const out2 = easeInOut(seg(t, 4.0, 4.3));
  const w = lerp(800, 600, mv), cy = lerp(900, 720, mv);
  const mark = $('mark');
  mark.style.left = (540 - w / 2) + 'px';
  mark.style.top = (cy - w * 0.275) + 'px';
  mark.setAttribute('width', w); mark.setAttribute('height', w * 0.55);
  mark.style.opacity = 1 - out2;
  reveal($('t1'), seg(t, 2.45, 2.85), out2);
  reveal($('t2'), seg(t, 2.6, 3.0), out2);
  const tg = easeOut(seg(t, 3.0, 3.6));
  $('tag').style.opacity = tg * (1 - out2);
  $('tag').style.letterSpacing = lerp(22, 10, tg) + 'px';
  // ----- scene 3: photo -----
  const pin = easeOut(seg(t, 4.2, 4.75)), pout = easeInOut(seg(t, 8.1, 8.4));
  $('photoWrap').style.opacity = pin * (1 - pout);
  $('photo').style.transform = `scale(${lerp(1.0, 1.1, seg(t, 4.2, 8.4))})`;
  const out3 = easeInOut(seg(t, 5.85, 6.05));
  $('top3').style.opacity = easeOut(seg(t, 4.5, 4.9)) * (1 - pout);
  $('eyebrow').style.opacity = easeOut(seg(t, 4.7, 5.0)) * (1 - out3);
  reveal($('name'), seg(t, 4.85, 5.3), out3);
  const mb = easeOut(seg(t, 5.1, 5.45));
  $('mbbs').style.opacity = mb * (1 - out3);
  $('mbbs').style.transform = `translateX(${(1 - mb) * -40}px)`;
  const aw = easeOut(seg(t, 5.3, 5.7));
  $('awards').style.opacity = .9 * aw * (1 - out3);
  $('awards').style.transform = `translateY(${(1 - aw) * 20}px)`;
  slam($('k1'), t, 6.1, 6.75);
  slam($('k2'), t, 6.75, 7.4);
  slam($('k3'), t, 7.4, 8.15);
  // gold sweep between scenes
  const sw = seg(t, 8.12, 8.5);
  $('sweep').style.transform = `scaleX(${easeInOut(sw)})`;
  $('sweep').style.opacity = sw > 0 ? 1 - seg(t, 8.45, 8.7) : 0;
  // ----- scene 4: manifesto -----
  const out4 = seg(t, 11.6, 12.0);
  reveal($('m1'), seg(t, 8.5, 8.85));
  reveal($('m2'), seg(t, 8.85, 9.2));
  reveal($('m3'), seg(t, 9.2, 9.6));
  $('rule').style.transform = `scaleX(${easeOut(seg(t, 9.9, 10.3))})`;
  $('mark2').style.opacity = easeOut(seg(t, 10.05, 10.45));
  $('handle').style.opacity = easeOut(seg(t, 10.2, 10.6));
  $('handle').style.transform = `translateY(${(1 - easeOut(seg(t, 10.2, 10.6))) * 16}px)`;
  // ----- finish -----
  $('grain').style.backgroundImage = `url(assets/grain${Math.floor(t * 30) % 4}.png)`;
  $('fade').style.opacity = out4;
};
window.ecgLength = ECG_LEN;
setTime(0);
</script>
</body>
</html>
